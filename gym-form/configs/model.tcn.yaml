# ── Model config — Causal Temporal Convolutional Network ──

model:
  type: causal_tcn

  # Input dimension — set after feature enumeration (Phase 1).
  # Placeholder based on planned features:
  #   knee_angle_L, knee_angle_R, elbow_angle_L, elbow_angle_R,
  #   trunk_inclination, wrist_y_L, wrist_y_R,
  #   d_knee_angle_L, d_knee_angle_R, d_elbow_angle_L, d_elbow_angle_R,
  #   d_trunk_inclination, d_wrist_y_L, d_wrist_y_R,
  #   shoulder_width (scale ref), hip_center_y (vertical ref)
  in_features: 16    # PLACEHOLDER — finalize in Phase 1

  # TCN backbone
  channels: [64, 64, 64]
  kernel_size: 3
  dilations: [1, 2, 4]
  dropout: 0.1

  # Receptive field = sum(d * (k-1) for d in dilations) + 1
  # = (1*2 + 2*2 + 4*2) + 1 = 15 frames per block, 3 blocks stacked
  # Effective RF ≈ 43 frames (~1.4 s @ 30 FPS)
  # For wider RF, add dilation 8 → RF ≈ 59 frames (~2.0 s)

  # Output heads — OHP-only for MVP
  n_labels: 2          # ohp_elbow, ohp_knee
  # n_exercises: 1     # single-exercise for now; expand later
