[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-form"
version = "0.1.0"
description = "Real-time gym form detection — multi-label temporal model for exercise error detection"
requires-python = ">=3.10"
dependencies = [
    # --- Pose estimation ---
    "mediapipe>=0.10",
    # --- ML / Modelling ---
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    # --- Data / Config ---
    "pyyaml>=6.0",
    "pandas>=2.0",
    # --- Evaluation ---
    "scikit-learn>=1.3",
    # --- Visualisation ---
    "matplotlib>=3.7",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ipykernel>=6.0",
    "jupyter>=1.0",
    "tqdm>=4.65",
]
export = [
    "onnx>=1.14",
    "onnxruntime>=1.15",
]
tracking = [
    "tensorboard>=2.13",
]
voice = [
    "SpeechRecognition>=3.10",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.90",
    # Optional: offline wake word (requires free Picovoice AccessKey)
    # "pvporcupine>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
